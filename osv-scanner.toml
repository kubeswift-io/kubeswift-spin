# OSV-Scanner exceptions. Each names one vulnerability, why it does not
# apply, and a date to review it again (hack/check-osv-inputs.sh enforces
# this form). Remove an entry as soon as a fixed version exists.

# signer/cosign: cosign v3.1.3 links the Azure Container Registry credential
# helper, which can send Azure credentials from AZURE_* environment variables
# to non-ACR hosts. The cache signer is given no Azure credentials, so the
# helper has none to send. No fixed version exists.
[[IgnoredVulns]]
id = "GO-2026-6225"
ignoreUntil = 2027-01-31
reason = "cache signer cosign: Azure ACR credential helper; the signer has no Azure credentials; no fix released"

# signer/cosign: golang.org/x/crypto/openpgp is deprecated and unmaintained.
# The cache signer signs with a cosign key or KMS key and never reads or
# verifies OpenPGP data. No fixed version exists.
[[IgnoredVulns]]
id = "GO-2026-5932"
ignoreUntil = 2027-01-31
reason = "cache signer cosign: unmaintained openpgp package advisory; the signer never handles OpenPGP data; no fix released"
