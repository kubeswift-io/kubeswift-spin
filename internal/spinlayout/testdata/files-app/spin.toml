# Golden-test fixture (internal/spinlayout): a component with static files,
# one small enough for Spin to inline and two pushed as layers or, with
# SPIN_OCI_ARCHIVE_LAYERS=1, as one archive layer.
spin_manifest_version = 2

[application]
name = "files-app"
version = "0.1.0"

[[trigger.http]]
route = "/..."
component = "web"

[component.web]
source = "../../../../examples/target/wasm32-wasip2/release/hello_http.wasm"
files = ["small.txt", "static/**/*"]
