# Default values for kubeswift-spin.
#
# The chart installs only kubeswift-spin. KubeSwift and Spin Operator are
# prerequisites: their CRDs must exist before installing, and the controller
# refuses to start without them.

image:
  repository: ghcr.io/kubeswift-io/kubeswift-spin
  # Defaults to the chart appVersion.
  tag: ""
  # When set (sha256:...), the image is pulled by digest and tag is ignored.
  digest: ""
  pullPolicy: IfNotPresent

# Runtime rootfs image booted by every SwiftSandbox. It is passed to the
# controller as --runtime-image and can be overridden per executor. It has
# its own version (runtime/VERSION), independent of the chart appVersion:
# changing it replaces every replica that uses it.
runtimeImage:
  repository: ghcr.io/kubeswift-io/kubeswift-spin-runtime
  tag: spin-4.2.1-r3
  digest: ""

imagePullSecrets: []

replicaCount: 1

controller:
  # CPU and memory used when a SpinApp sets no resources.
  defaultCPU: "1"
  defaultMemory: 512Mi
  # Bounds on what a SpinApp may request per replica.
  minMemory: 256Mi
  maxMemory: 16Gi
  maxVCPUs: 8
  # Largest spec.replicas accepted per SpinApp.
  maxReplicas: 20
  # Restrict the namespaces watched. Empty watches all namespaces. RBAC is
  # still cluster-scoped.
  watchNamespaces: []
  # debug, info or error.
  logLevel: info
  extraArgs: []

# Default SpinAppExecutors. SpinAppExecutor is namespaced: create one per
# namespace that runs SpinApps. Each entry becomes a separate executor
# profile; see docs/executor-contract.md.
executors:
  - name: kubeswift
    namespaces: [default]
    # networkMode: restricted     # restricted (default) or open
    # rootfsMode: block           # block or virtiofs
    # kernelProfile: sandbox
    # sandboxPool: spin-warm
    # nodeSelector: {}
    # defaultCPU: "1"
    # defaultMemory: 512Mi
    # runtimeImage: ""            # overrides runtimeImage for this executor
    # runtimeImagePullSecret: ""
    # runtimeImageVerifyKeySecret: ""
    # KubeSwift v0.16.0 or later:
    # egressAllow:                # destinations restricted sandboxes may reach
    #   - service: {name: llm, namespace: inference}
    #     ports: [{port: 8000}]
    # ingressFrom:                # NetworkPolicy peers allowed to reach the Spin port
    #   - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: frontend}}
    # readinessStartup: auto      # auto (default), always (KubeSwift v0.16.2) or never; see
    #                             # docs/executor-contract.md#readiness-startup
    # drainPeriod: 30s            # KubeSwift v0.16.3: how long a deleted replica keeps
    #                             # running after leaving the Service (KubeSwift
    #                             # default 5s); a SpinApp annotation overrides it
    # maxDrainPeriod: 2m          # the longest drain a SpinApp may set (default 10m)
    # compiledCache: enabled      # SpinApps get signed compiled caches; needs
    #                             # compiledCache.enabled (docs/compiled-cache.md)
    # otel:
    #   exporter_otlp_endpoint: http://otel-collector.observability:4318

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

metrics:
  enabled: true
  port: 8080
  # Serve metrics over HTTPS with Kubernetes token authentication and
  # authorization. Adds RBAC for tokenreviews and subjectaccessreviews.
  secure: false
  service:
    annotations: {}
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

# Trusted compiled Wasmtime cache (ADR 0014). Off by default. When enabled,
# the chart installs the SpinCompiledCache CRD and the cache manager, and
# executors opt in with the annotation spin.kubeswift.io/compiled-cache:
# enabled. It needs KubeSwift v0.19.3 or later and the administrator setup in
# docs/compiled-cache.md (export policy, verification policy, signer key).
compiledCache:
  enabled: false
  # Base repository of compiled caches: registry host and path, lowercase,
  # no tag or digest. Each namespace's caches go to
  # <repository>/<namespace>/wasmtime-cache.
  repository: ""
  # Architecture for executors whose node selector does not name
  # kubernetes.io/arch: amd64 or arm64.
  architecture: amd64
  # Runtime images, besides runtimeImage (which must be pinned by digest),
  # that compiled caches are built and signed for, as
  # repository@sha256:<digest>. An executor with any other runtime image
  # gets no cache.
  extraRuntimes: []
  # How long a record that no SpinApp uses is kept. The most recently
  # replaced record of each SpinApp is always kept.
  retention: 24h
  # Most records kept for one namespace.
  maxRecordsPerNamespace: 32
  # Name of a kubernetes.io/dockerconfigjson Secret, present in every
  # enabled namespace, that can read only that namespace's cache repository
  # (<repository>/<namespace>/**). Replicas and placements read the signed
  # cache with it. Create it before labelling a namespace: without it,
  # placements fail and replicas start without the cache (KubeSwift skips
  # it, PullSecretInvalid). Empty: replicas use the runtime image pull
  # Secret and placements read anonymously, which the prerequisites rule
  # out.
  pullSecretName: ""
  # How long a replica of an executor without a sandboxPool may wait for
  # its cache before starting without it (0s to 5m). 0s gives such
  # replicas no cache (NoWarmPool): KubeSwift verifies the signature with
  # the registry and fetches the cache on a node without it, which costs
  # more than it saves for small applications. Replicas of an executor with
  # a sandboxPool never wait: they get the cache once the placement on
  # their pool reports every node prepared, and use it only when their node
  # holds it, also when they boot cold because no slot is free.
  fetchTimeout: 0s
  # Compiler sandboxes: one per record and attempt, in the SpinApp's
  # namespace, cold-booted (KubeSwift outputs do not use warm slots).
  compiler:
    cpu: 1
    memory: 1Gi
    timeout: 10m
    # Largest exported cache and most files and directories in it.
    maxSize: 512Mi
    maxEntries: 10000
    # Compilers running at once, cluster-wide and per namespace.
    maxConcurrent: 4
    maxConcurrentPerNamespace: 1
  # The cache signer: the only holder of the signing key. It checks each
  # exported cache and signs it with the record's claims.
  signer:
    image:
      repository: ghcr.io/kubeswift-io/kubeswift-spin-cache-signer
      tag: ""      # defaults to the chart appVersion
      digest: ""
      pullPolicy: IfNotPresent
    key:
      # A Secret in the release namespace with cosign.key (a cosign private
      # key) and cosign.password. Mounted into the signer only.
      secretName: ""
      # Or a key reference cosign understands (awskms://, gcpkms://,
      # hashivault://); preferred where a KMS is available. azurekms:// is
      # refused until cosign fixes GO-2026-6225.
      kmsRef: ""
    # A kubernetes.io/dockerconfigjson Secret in the release namespace that
    # can read the exported caches and push their signatures (the same
    # repositories as the export policy).
    registryCredentialsSecret: ""
    # PEM CA certificates the signer and cosign trust, on top of the system
    # roots, for all their TLS connections (the cache registry, and a KMS):
    # set it for a registry behind a private CA, with the same bundle as
    # KubeSwift's sandboxMaterialize.registryCABundle. Empty uses the system
    # roots only.
    registryCABundle: ""
    # Extra environment, for example KMS credentials.
    extraEnv: []
    serviceAccountAnnotations: {}
    logLevel: info
    extraArgs: []
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  manager:
    replicaCount: 1
    logLevel: info
    extraArgs: []
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
