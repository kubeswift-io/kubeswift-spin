apiVersion: v2
name: kubeswift-spin
description: SpinKube executor that runs SpinApps in KubeSwift microVM sandboxes
type: application
version: 0.2.0
appVersion: v0.2.0
kubeVersion: ">=1.31.0-0"
home: https://github.com/kubeswift-io/kubeswift-spin
sources:
  - https://github.com/kubeswift-io/kubeswift-spin
keywords:
  - spin
  - spinkube
  - webassembly
  - kubeswift
  - microvm
annotations:
  # Prerequisites, not chart dependencies: the chart never installs them.
  spin.kubeswift.io/requires: "KubeSwift >= v0.16.3 (sandbox CRDs; v0.15.1 to v0.16.2 run with limitations; compiledCache needs >= v0.19.3), Spin Operator v0.6.1 (core.spinkube.dev CRDs)"
