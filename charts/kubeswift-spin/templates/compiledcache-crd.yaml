{{- if .Values.compiledCache.enabled }}
{{- /* The CRD is generated by `make generate` from api/v1alpha1. It is kept
when compiled caches are disabled or the chart is uninstalled, so records are
not deleted by a values change. */}}
{{- $crd := .Files.Get "files/crds/spin.kubeswift.io_spincompiledcaches.yaml" | fromYaml }}
{{- $_ := set $crd.metadata.annotations "helm.sh/resource-policy" "keep" }}
{{- $_ := set $crd.metadata "labels" (include "kubeswift-spin.labels" . | fromYaml) }}
{{ toYaml $crd }}
{{- end }}
