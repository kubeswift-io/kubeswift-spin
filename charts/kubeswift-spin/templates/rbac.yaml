# Least-privilege RBAC. kubeswift-spin reads SpinApps and executors, owns the
# SpinApp status fields it reports, and creates and deletes SwiftSandboxes.
# It needs no access to Secrets, ConfigMaps, Pods or Services.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeswift-spin.fullname" . }}
  labels:
    {{- include "kubeswift-spin.labels" . | nindent 4 }}
rules:
  - apiGroups: ["core.spinkube.dev"]
    resources: ["spinapps", "spinappexecutors"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["core.spinkube.dev"]
    resources: ["spinapps/status"]
    verbs: ["get", "patch"]
  # Setting blockOwnerDeletion on the SwiftSandbox owner reference requires
  # update on the owner's finalizers subresource. No finalizer is added.
  - apiGroups: ["core.spinkube.dev"]
    resources: ["spinapps/finalizers"]
    verbs: ["update"]
  # SwiftSandbox specs are immutable, so there is no update or patch.
  - apiGroups: ["sandbox.kubeswift.io"]
    resources: ["swiftsandboxes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["sandbox.kubeswift.io"]
    resources: ["swiftsandboxpools"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeswift-spin.fullname" . }}
  labels:
    {{- include "kubeswift-spin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeswift-spin.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeswift-spin.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Leader election uses a single Lease in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubeswift-spin.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeswift-spin.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["kubeswift-spin.spin.kubeswift.io"]
    verbs: ["get", "update"]
  # controller-runtime records the LeaderElection Event ("became leader")
  # through the core/v1 Events API, in this namespace only.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubeswift-spin.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeswift-spin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubeswift-spin.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeswift-spin.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if and .Values.metrics.enabled .Values.metrics.secure }}
---
# Secure metrics: the controller authenticates scrapers with TokenReview and
# authorizes them with SubjectAccessReview.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeswift-spin.fullname" . }}-metrics-auth
  labels:
    {{- include "kubeswift-spin.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeswift-spin.fullname" . }}-metrics-auth
  labels:
    {{- include "kubeswift-spin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeswift-spin.fullname" . }}-metrics-auth
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeswift-spin.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Bind this role to the Prometheus service account to allow scraping.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeswift-spin.fullname" . }}-metrics-reader
  labels:
    {{- include "kubeswift-spin.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
{{- end }}
{{- if or .Values.compiledCache.enabled .Values.localApplication.enabled }}
{{- if .Values.compiledCache.enabled }}
---
# Compiled caches: the controller only reads SpinCompiledCache records, in
# this namespace. Only the cache manager and the cache signer write them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubeswift-spin.fullname" . }}-compiled-cache-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeswift-spin.labels" . | nindent 4 }}
rules:
  - apiGroups: ["spin.kubeswift.io"]
    resources: ["spincompiledcaches"]
    verbs: ["get", "list", "watch"]
{{- end }}
---
# Namespaces opt in to compiled caches and local applications with
# administrator-set labels.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeswift-spin.fullname" . }}-compiled-cache-namespaces
  labels:
    {{- include "kubeswift-spin.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeswift-spin.fullname" . }}-compiled-cache-namespaces
  labels:
    {{- include "kubeswift-spin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeswift-spin.fullname" . }}-compiled-cache-namespaces
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeswift-spin.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.compiledCache.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubeswift-spin.fullname" . }}-compiled-cache-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeswift-spin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubeswift-spin.fullname" . }}-compiled-cache-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeswift-spin.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
{{- if .Values.localApplication.enabled }}
---
# Local applications (ADR 0015): the controller only reads the application
# placements the cache manager writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeswift-spin.fullname" . }}-local-application-reader
  labels:
    {{- include "kubeswift-spin.labels" . | nindent 4 }}
rules:
  - apiGroups: ["sandbox.kubeswift.io"]
    resources: ["swiftartifactplacements"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeswift-spin.fullname" . }}-local-application-reader
  labels:
    {{- include "kubeswift-spin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeswift-spin.fullname" . }}-local-application-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeswift-spin.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if not (and .Values.compiledCache.enabled .Values.localApplication.enabled) }}
---
# Rendered unless both compiled caches and local applications are enabled.
# The controller deletes the SwiftArtifactPlacements that carry
# kubeswift-spin's marks for a disabled feature, which the cache manager no
# longer deletes. It never creates or updates them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeswift-spin.fullname" . }}-placement-cleanup
  labels:
    {{- include "kubeswift-spin.labels" . | nindent 4 }}
rules:
  - apiGroups: ["sandbox.kubeswift.io"]
    resources: ["swiftartifactplacements"]
    verbs: ["list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeswift-spin.fullname" . }}-placement-cleanup
  labels:
    {{- include "kubeswift-spin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeswift-spin.fullname" . }}-placement-cleanup
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeswift-spin.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
