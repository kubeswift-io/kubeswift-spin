apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeswift-spin.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeswift-spin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubeswift-spin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubeswift-spin.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kubeswift-spin.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: {{ include "kubeswift-spin.imageRef" (list .Values.image .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect
            - --leader-election-namespace={{ .Release.Namespace }}
            - --health-probe-bind-address=:8081
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --metrics-secure={{ .Values.metrics.secure }}
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
            - --runtime-image={{ include "kubeswift-spin.imageRef" (list .Values.runtimeImage .Chart.AppVersion) }}
            - --default-cpu={{ .Values.controller.defaultCPU }}
            - --default-memory={{ .Values.controller.defaultMemory }}
            - --min-memory={{ .Values.controller.minMemory }}
            - --max-memory={{ .Values.controller.maxMemory }}
            - --max-vcpus={{ .Values.controller.maxVCPUs }}
            - --max-replicas={{ .Values.controller.maxReplicas }}
            {{- with .Values.controller.watchNamespaces }}
            - --watch-namespaces={{ join "," . }}
            {{- end }}
            - --zap-log-level={{ .Values.controller.logLevel }}
            {{- range .Values.controller.extraArgs }}
            - {{ . }}
            {{- end }}
          ports:
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
            - name: probes
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
