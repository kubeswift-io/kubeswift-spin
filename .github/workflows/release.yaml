name: Release

# Publishes images, the Helm chart and example artifacts for a semver tag.
# It runs only for tags pushed to the canonical repository and only after
# approval of the "release" environment, so development pushes and forks
# never publish anything.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io/kubeswift-io

jobs:
  controller-image:
    name: Controller image
    if: github.repository == 'kubeswift-io/kubeswift-spin'
    needs: runtime-image
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write       # cosign keyless signing
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/kubeswift-spin
          tags: type=semver,pattern=v{{version}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DEFAULT_RUNTIME_IMAGE=${{ env.REGISTRY }}/kubeswift-spin-runtime@${{ needs.runtime-image.outputs.digest }}
      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/kubeswift-spin@${DIGEST}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/kubeswift-spin
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The runtime image has its own version (runtime/VERSION). It is built and
  # pushed only when that tag does not exist yet, so a controller release
  # reuses the existing digest and does not replace running replicas.
  runtime-image:
    name: Runtime image
    if: github.repository == 'kubeswift-io/kubeswift-spin'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.result.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: existing
        name: Check for an existing runtime image
        run: |
          tag="$(cat runtime/VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if digest="$(docker buildx imagetools inspect "${REGISTRY}/kubeswift-spin-runtime:${tag}" --format '{{json .Manifest.Digest}}' 2>/dev/null)"; then
            echo "digest=$(tr -d '"' <<<"$digest")" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify the pinned Spin release
        if: steps.existing.outputs.digest == ''
        run: hack/verify-spin-release.sh
      - id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/kubeswift-spin-runtime:${{ steps.existing.outputs.tag }}
          provenance: mode=max
          sbom: true
      - name: Sign
        if: steps.existing.outputs.digest == ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/kubeswift-spin-runtime@${DIGEST}"
      - if: steps.existing.outputs.digest == ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/kubeswift-spin-runtime
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - id: result
        env:
          EXISTING: ${{ steps.existing.outputs.digest }}
          BUILT: ${{ steps.build.outputs.digest }}
        run: echo "digest=${EXISTING:-$BUILT}" >> "$GITHUB_OUTPUT"

  chart:
    name: Helm chart
    if: github.repository == 'kubeswift-io/kubeswift-spin'
    needs: [controller-image, runtime-image]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml==6.0.2
      - name: Package with pinned image digests
        env:
          CONTROLLER_DIGEST: ${{ needs.controller-image.outputs.digest }}
          RUNTIME_DIGEST: ${{ needs.runtime-image.outputs.digest }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          yq() { python3 -c "import sys,yaml; d=yaml.safe_load(open(sys.argv[1])); exec(sys.argv[2]); yaml.safe_dump(d, open(sys.argv[1],'w'), sort_keys=False)" "$@"; }
          yq charts/kubeswift-spin/values.yaml "d['image']['digest']='${CONTROLLER_DIGEST}'; d['runtimeImage']['digest']='${RUNTIME_DIGEST}'"
          helm package charts/kubeswift-spin --version "$version" --app-version "$GITHUB_REF_NAME" -d dist
      - name: Push and sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          out="$(helm push dist/kubeswift-spin-*.tgz oci://${REGISTRY}/charts 2>&1)"
          echo "$out"
          digest="$(sed -n 's/^Digest: //p' <<<"$out")"
          cosign sign --yes "${REGISTRY}/charts/kubeswift-spin@${digest}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart
          path: dist/*.tgz

  examples:
    name: Example artifacts
    if: github.repository == 'kubeswift-io/kubeswift-spin'
    needs: controller-image
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test examples
        run: make example-test
      - name: Push Spin OCI artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | bin/spin registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for e in hello-http request-info outbound-http key-value serverless-ai experimental/mcp; do
            make example-push EXAMPLE="$e" EXAMPLE_REGISTRY="${REGISTRY}/kubeswift-spin-examples" EXAMPLE_TAG="$GITHUB_REF_NAME"
          done

  github-release:
    name: GitHub release
    if: github.repository == 'kubeswift-io/kubeswift-spin'
    needs: [controller-image, runtime-image, chart, examples]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          body: |
            Images (signed with cosign keyless, with SBOM and provenance attestations):
            - ${{ env.REGISTRY }}/kubeswift-spin@${{ needs.controller-image.outputs.digest }}
            - ${{ env.REGISTRY }}/kubeswift-spin-runtime@${{ needs.runtime-image.outputs.digest }}

            Helm chart: oci://${{ env.REGISTRY }}/charts/kubeswift-spin

            See CHANGELOG.md and docs/compatibility.md.
