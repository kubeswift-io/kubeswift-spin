name: Release

# Publishes images, the Helm chart and example artifacts for a semver tag.
# It runs only for tags pushed to the canonical repository and only after
# approval of the "release" environment, so development pushes and forks
# never publish anything.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io/kubeswift-io

jobs:
  # Full OSV dependency scan of the tagged source before anything is
  # published: a vulnerability disclosed after the last pull request cannot
  # ship because PR-time scanning was clean. The runtime image job, which
  # every publishing job depends on, needs it.
  osv-scan:
    name: OSV-Scanner
    if: github.repository == 'kubeswift-io/kubeswift-spin'
    permissions:
      actions: read          # the SARIF upload reads the workflow run
      contents: read
      security-events: write # SARIF upload to code scanning
    # google/osv-scanner-action v2.6.0; its own actions are pinned by SHA.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      runs-on: ubuntu-24.04
      ref: ${{ github.sha }}
      # Explicit lockfiles: a recursive scan follows .gitignore, even for
      # tracked files. hack/check-osv-inputs.sh (make verify) keeps this list
      # equal to the tracked dependency manifests.
      scan-args: |-
        --lockfile=go.mod
        --lockfile=examples/Cargo.lock

  controller-image:
    name: Controller image
    if: github.repository == 'kubeswift-io/kubeswift-spin'
    needs: runtime-image
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write       # cosign keyless signing
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "invalid release tag: $TAG"; exit 1; }'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/kubeswift-spin
          # The validated git tag itself (v0.1.0, v0.1.0-rc2). type=semver
          # would drop the "v" from pre-release tags: metadata-action emits
          # only {{version}} for pre-releases, whatever the pattern.
          tags: type=raw,value=${{ github.ref_name }}
          # Only the exact version tag; never a moving "latest".
          flavor: latest=false
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DEFAULT_RUNTIME_IMAGE=${{ env.REGISTRY }}/kubeswift-spin-runtime@${{ needs.runtime-image.outputs.digest }}
      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/kubeswift-spin@${DIGEST}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/kubeswift-spin
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The runtime image has its own version (runtime/VERSION). It is built and
  # pushed only when that tag does not exist yet, so a controller release
  # reuses the existing digest and does not replace running replicas.
  runtime-image:
    name: Runtime image
    if: github.repository == 'kubeswift-io/kubeswift-spin'
    needs: osv-scan
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.result.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "invalid release tag: $TAG"; exit 1; }'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: existing
        name: Check for an existing runtime image
        run: |
          tag="$(cat runtime/VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if digest="$(docker buildx imagetools inspect "${REGISTRY}/kubeswift-spin-runtime:${tag}" --format '{{json .Manifest.Digest}}' 2>/dev/null)"; then
            digest="$(tr -d '"' <<<"$digest")"
            # Reuse only an image signed by this release workflow; a tag that
            # was overwritten by anything else fails the release.
            cosign verify "${REGISTRY}/kubeswift-spin-runtime@${digest}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp '^https://github.com/kubeswift-io/kubeswift-spin/.github/workflows/release.yaml@refs/tags/v' >/dev/null
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify the pinned Spin release
        if: steps.existing.outputs.digest == ''
        run: hack/verify-spin-release.sh
      - id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/kubeswift-spin-runtime:${{ steps.existing.outputs.tag }}
          provenance: mode=max
          sbom: true
      - name: Sign
        if: steps.existing.outputs.digest == ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/kubeswift-spin-runtime@${DIGEST}"
      - if: steps.existing.outputs.digest == ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/kubeswift-spin-runtime
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - id: result
        env:
          EXISTING: ${{ steps.existing.outputs.digest }}
          BUILT: ${{ steps.build.outputs.digest }}
        run: echo "digest=${EXISTING:-$BUILT}" >> "$GITHUB_OUTPUT"

  chart:
    name: Helm chart
    if: github.repository == 'kubeswift-io/kubeswift-spin'
    needs: [controller-image, runtime-image]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "invalid release tag: $TAG"; exit 1; }'
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # cosign and the provenance push read the Docker credentials; helm
      # keeps its own, so log in to both.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package with pinned image digests
        env:
          CONTROLLER_DIGEST: ${{ needs.controller-image.outputs.digest }}
          RUNTIME_DIGEST: ${{ needs.runtime-image.outputs.digest }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Set image.digest and runtimeImage.digest in the packaged values.
          awk -v c="$CONTROLLER_DIGEST" -v r="$RUNTIME_DIGEST" '
            /^[a-zA-Z]/ { section = $1 }
            section == "image:" && /^  digest:/ { print "  digest: \"" c "\""; next }
            section == "runtimeImage:" && /^  digest:/ { print "  digest: \"" r "\""; next }
            { print }' charts/kubeswift-spin/values.yaml > values.tmp
          mv values.tmp charts/kubeswift-spin/values.yaml
          helm template x charts/kubeswift-spin | grep -q "kubeswift-spin@${CONTROLLER_DIGEST}"
          helm template x charts/kubeswift-spin | grep -q "kubeswift-spin-runtime@${RUNTIME_DIGEST}"
          helm package charts/kubeswift-spin --version "$version" --app-version "$GITHUB_REF_NAME" -d dist
      - id: push
        name: Push and sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          out="$(helm push dist/kubeswift-spin-*.tgz "oci://${REGISTRY}/charts" 2>&1)"
          echo "$out"
          digest="$(sed -n 's/^Digest: //p' <<<"$out")"
          [[ "$digest" == sha256:* ]] || { echo "no digest in the helm push output"; exit 1; }
          cosign sign --yes "${REGISTRY}/charts/kubeswift-spin@${digest}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/charts/kubeswift-spin
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: dist/*.tgz

  # Building runs third-party build scripts (cargo), so it gets no write
  # token. The push job only uploads the built artifacts.
  examples-build:
    name: Example artifacts (build)
    if: github.repository == 'kubeswift-io/kubeswift-spin'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "invalid release tag: $TAG"; exit 1; }'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The release never restores caches that other workflows wrote.
          cache: false
      - name: Build and test
        run: make example-test
      # Only the Wasm binaries cross to the publishing job; it uses the
      # spin.toml files from its own checkout, so build scripts cannot change
      # what is pushed and signed beyond the binaries.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: examples
          path: examples/target/wasm32-wasip2/release/*.wasm
          if-no-files-found: error

  examples-push:
    name: Example artifacts (push)
    if: github.repository == 'kubeswift-io/kubeswift-spin'
    needs: [examples-build, controller-image]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write       # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "invalid release tag: $TAG"; exit 1; }'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: examples
          path: examples/target/wasm32-wasip2/release
      - name: Install the pinned Spin CLI
        run: hack/install-spin.sh
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Push and sign Spin OCI artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "$GITHUB_TOKEN" | bin/spin registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$GITHUB_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          mkdir -p dist
          # Absolute path: experimental/mcp is one directory deeper.
          spin="$PWD/bin/spin"
          for e in hello-http request-info outbound-http key-value serverless-ai experimental/mcp; do
            app="$(awk -F'"' '/^name = /{print $2; exit}' "examples/$e/spin.toml")"
            ref="${REGISTRY}/kubeswift-spin-examples/${app}"
            out="$(cd "examples/$e" && "$spin" registry push "${ref}:${TAG}" 2>&1)"
            echo "$out"
            digest="$(grep -o 'sha256:[0-9a-f]\{64\}' <<<"$out" | tail -1)"
            [[ -n "$digest" ]] || { echo "no digest in the spin push output for $app"; exit 1; }
            cosign sign --yes "${ref}@${digest}"
            echo "${ref}:${TAG}@${digest}" >> dist/examples.txt
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-digests
          path: dist/examples.txt
          if-no-files-found: error

  github-release:
    name: GitHub release
    if: github.repository == 'kubeswift-io/kubeswift-spin'
    needs: [controller-image, runtime-image, chart, examples-push]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      packages: read        # SBOM generation pulls the images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "invalid release tag: $TAG"; exit 1; }'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: example-digests
          path: dist
      - name: Controller image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/kubeswift-spin@${{ needs.controller-image.outputs.digest }}
          format: spdx-json
          output-file: dist/kubeswift-spin.spdx.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          upload-artifact: false
          upload-release-assets: false
      - name: Runtime image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/kubeswift-spin-runtime@${{ needs.runtime-image.outputs.digest }}
          format: spdx-json
          output-file: dist/kubeswift-spin-runtime.spdx.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          upload-artifact: false
          upload-release-assets: false
      - name: Image digests and checksums
        env:
          CONTROLLER: ${{ env.REGISTRY }}/kubeswift-spin:${{ github.ref_name }}@${{ needs.controller-image.outputs.digest }}
          RUNTIME: ${{ env.REGISTRY }}/kubeswift-spin-runtime@${{ needs.runtime-image.outputs.digest }}
          CHART: ${{ env.REGISTRY }}/charts/kubeswift-spin@${{ needs.chart.outputs.digest }}
        run: |
          printf '%s\n' "$CONTROLLER" "$RUNTIME" "$CHART" > dist/images.txt
          cd dist
          sha256sum -- *.tgz *.spdx.json images.txt examples.txt > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*.tgz
            dist/*.spdx.json
            dist/images.txt
            dist/examples.txt
            dist/SHA256SUMS
          body: |
            Images, the Helm chart and the example Spin artifacts are signed with cosign keyless signing by this workflow. The images and the chart have SLSA provenance attestations; the images also carry BuildKit SBOM and provenance attestations.

            - Controller: `${{ env.REGISTRY }}/kubeswift-spin:${{ github.ref_name }}@${{ needs.controller-image.outputs.digest }}`
            - Runtime: `${{ env.REGISTRY }}/kubeswift-spin-runtime@${{ needs.runtime-image.outputs.digest }}`
            - Helm chart: `oci://${{ env.REGISTRY }}/charts/kubeswift-spin`, version `${{ github.ref_name }}` without the leading `v`, digest `${{ needs.chart.outputs.digest }}`
            - Example artifacts: see `examples.txt`

            Images are built for linux/amd64 and linux/arm64; only linux/amd64 has been tested end to end.

            See CHANGELOG.md, docs/compatibility.md and docs/releasing.md (verification).
