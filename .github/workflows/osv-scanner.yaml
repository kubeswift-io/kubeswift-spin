name: OSV-Scanner

# Full dependency scan of main, daily and on every push, so that
# vulnerabilities disclosed after a change was merged are reported. Results
# go to Security > Code scanning. See docs/security-model.md (Vulnerability
# scanning).
on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: OSV-Scanner
    permissions:
      actions: read          # the SARIF upload reads the workflow run
      contents: read
      security-events: write # SARIF upload to code scanning
    # google/osv-scanner-action v2.6.0; its own actions are pinned by SHA.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      runs-on: ubuntu-24.04
      # Explicit lockfiles: a recursive scan follows .gitignore, even for
      # tracked files. hack/check-osv-inputs.sh (make verify) keeps this list
      # equal to the tracked dependency manifests.
      scan-args: |-
        --lockfile=go.mod
        --lockfile=examples/Cargo.lock
        --lockfile=signer/cosign/go.mod
