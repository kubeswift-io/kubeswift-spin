name: OSV-Scanner

# Full dependency scan of main, daily and on every push, so that
# vulnerabilities disclosed after a change was merged are reported. Results
# go to Security > Code scanning. See docs/security-model.md (Vulnerability
# scanning).
on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: OSV-Scanner
    permissions:
      actions: read          # the SARIF upload reads the workflow run
      contents: read
      security-events: write # SARIF upload to code scanning
    # google/osv-scanner-action v2.6.0; its own actions are pinned by SHA.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      runs-on: ubuntu-24.04
