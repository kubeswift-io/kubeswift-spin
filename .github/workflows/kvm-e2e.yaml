name: KVM e2e

# Runs test/e2e/kvm-e2e.sh on a self-hosted runner whose kubeconfig points
# at a cluster with KubeSwift, Spin Operator and kubeswift-spin installed
# (see test/e2e/README.md). Manual only: public runners have no
# KubeSwift-capable KVM nodes.
on:
  workflow_dispatch:
    inputs:
      examples:
        description: registry prefix of the example Spin artifacts
        default: ghcr.io/kubeswift-io/kubeswift-spin-examples
      examples_tag:
        description: tag of the example Spin artifacts
        required: true
      namespace:
        description: namespace with the kubeswift executor and SwiftKernel
        default: kubeswift-spin-e2e

permissions:
  contents: read

jobs:
  e2e:
    runs-on: [self-hosted, linux, kvm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run
        env:
          EXAMPLES: ${{ inputs.examples }}
          EXAMPLES_TAG: ${{ inputs.examples_tag }}
          E2E_NAMESPACE: ${{ inputs.namespace }}
          E2E_WARM_POOL: "1"
        run: test/e2e/kvm-e2e.sh
