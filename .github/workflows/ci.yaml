name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  go:
    name: Go (lint, unit, envtest ${{ matrix.k8s }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        k8s: ["1.34.1", "1.37.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format, vet, prose
        run: make fmt-check vet check-prose
      - name: Lint
        run: make lint
      - name: Unit and envtest
        run: make test ENVTEST_K8S_VERSION=${{ matrix.k8s }}
      - name: Vulnerability scan
        if: matrix.k8s == '1.37.0'
        run: make vulncheck

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.2
      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml==6.0.2
      - name: Lint, kubeconform, policy
        run: make helm-lint

  examples:
    name: Example Spin applications
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # rustup is preinstalled; examples/rust-toolchain.toml selects the
      # pinned toolchain and the wasm32-wasip2 target.
      - name: Build and test examples
        run: make example-test

  runtime-image:
    name: Runtime image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify the pinned Spin release (digests and signatures)
        run: hack/verify-spin-release.sh
      - name: Build
        run: make runtime-image RUNTIME_IMAGE=kubeswift-spin-runtime:ci
      - name: Test
        run: make runtime-test RUNTIME_IMAGE=kubeswift-spin-runtime:ci
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: kubeswift-spin-runtime:ci
          format: spdx-json
          artifact-name: kubeswift-spin-runtime.spdx.json
      - name: Vulnerability scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: kubeswift-spin-runtime:ci
          severity-cutoff: high
          only-fixed: true
          output-format: table

  controller-image:
    name: Controller image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: make image IMAGE=kubeswift-spin:ci
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: kubeswift-spin:ci
          format: spdx-json
          artifact-name: kubeswift-spin.spdx.json
      - name: Vulnerability scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: kubeswift-spin:ci
          severity-cutoff: high
          only-fixed: true
          output-format: table

  kind:
    name: Integration (kind, Spin Operator, no KVM)
    runs-on: ubuntu-24.04
    needs: [go, helm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.2
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.30.0
      - name: Run
        run: make kind-test IMAGE=kubeswift-spin:it WITH_SPIN_OPERATOR=1
