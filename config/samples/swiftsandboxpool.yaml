# Warm pool for the kubeswift-warm executor. Image, CPU, memory and network
# mode must equal what kubeswift-spin puts in each SwiftSandbox; set image to
# the runtime image the controller uses (Helm value runtimeImage).
apiVersion: sandbox.kubeswift.io/v1alpha1
kind: SwiftSandboxPool
metadata:
  name: spin-warm
spec:
  image: ghcr.io/kubeswift-io/kubeswift-spin-runtime:spin-4.2.1-r1
  cpu: 1
  memory: 512Mi
  network:
    mode: restricted
    # KubeSwift v0.16.0 or later: kubeswift-spin exposes the Spin HTTP port,
    # so warm slots must declare it too.
    ports:
      - name: http-app
        port: 3000
  minWarm: 2
  maxWarm: 4
