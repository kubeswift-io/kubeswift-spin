# Executor profile for trusted applications that must reach in-cluster
# services. "open" removes every egress restriction of "restricted"; prefer
# an egress allowlist (kubeswift-egress.yaml) when one service is enough.
# Inbound traffic is limited to the Spin HTTP port, as with "restricted".
apiVersion: core.spinkube.dev/v1alpha1
kind: SpinAppExecutor
metadata:
  name: kubeswift-open
  labels:
    spin.kubeswift.io/managed-by: kubeswift-spin
  annotations:
    spin.kubeswift.io/network-mode: open
spec:
  createDeployment: false
