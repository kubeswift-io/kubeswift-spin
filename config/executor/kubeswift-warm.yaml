# Executor profile that starts replicas from a warm SwiftSandboxPool. The
# pool must match the sandbox shape exactly (runtime image, CPU, memory,
# network mode, exposed ports, egress allowlist, rootfs mode, kernel, node
# selector); see
# config/samples/swiftsandboxpool.yaml and docs/executor-contract.md.
apiVersion: core.spinkube.dev/v1alpha1
kind: SpinAppExecutor
metadata:
  name: kubeswift-warm
  labels:
    spin.kubeswift.io/managed-by: kubeswift-spin
  annotations:
    spin.kubeswift.io/sandbox-pool: spin-warm
    spin.kubeswift.io/default-cpu: "1"
    spin.kubeswift.io/default-memory: 512Mi
spec:
  createDeployment: false
