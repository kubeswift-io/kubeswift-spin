# The inference endpoint is an in-cluster Service. The kubeswift-egress
# executor (config/executor/kubeswift-egress.yaml) allows exactly that
# Service under the restricted network mode. The token comes from a Secret:
#   kubectl create secret generic llm-token --from-literal=token=<token>
apiVersion: core.spinkube.dev/v1alpha1
kind: SpinApp
metadata:
  name: serverless-ai
spec:
  image: ghcr.io/kubeswift-io/kubeswift-spin-examples/serverless-ai:v0.1.0-rc3
  executor: kubeswift-egress
  replicas: 1
  variables:
    - name: llm_model
      value: default-model
  runtimeConfig:
    llmCompute:
      type: remote_http
      options:
        - name: url
          value: http://llm.inference.svc.cluster.local:8000
        - name: api_type
          value: open_ai
        - name: auth_token
          valueFrom:
            secretKeyRef:
              name: llm-token
              key: token
