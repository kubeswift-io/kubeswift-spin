spin_manifest_version = 2

[application]
name = "hello-http"
version = "0.1.0"
description = "Minimal HTTP application used as the kubeswift-spin smoke test"

[[trigger.http]]
route = "/..."
component = "hello-http"

[component.hello-http]
source = "../target/wasm32-wasip2/release/hello_http.wasm"
allowed_outbound_hosts = []

[component.hello-http.build]
command = "cargo build --locked --target wasm32-wasip2 --release"
watch = ["src/**/*.rs", "Cargo.toml"]
